version: "3.9"

# ============================================================
# DIETER PRO - Docker Compose
# All services for the AI Music Studio platform
# ============================================================

services:

  # ----------------------------------------------------------
  # FRONTEND: Next.js 15 App (App Router, React 18)
  # ----------------------------------------------------------
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: dieter-web
    restart: unless-stopped
    env_file: ../../.env
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - API_URL=http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - dieter-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # BACKEND API: Node.js 20 + Fastify
  # ----------------------------------------------------------
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: dieter-api
    restart: unless-stopped
    env_file: ../../.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - dieter-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # DATABASE: PostgreSQL 16
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dieter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dieter
      POSTGRES_USER: dieter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../../apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - dieter-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dieter -d dieter"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # CACHE: Redis 7
  # ----------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: dieter-cache
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - dieter-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # AI WORKER: Node.js LLM Orchestration
  # ----------------------------------------------------------
  ai-worker:
    build:
      context: ../../apps/ai-worker
      dockerfile: Dockerfile
    container_name: dieter-ai-worker
    restart: unless-stopped
    env_file: ../../.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=${REDIS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - AUDIO_DSP_URL=http://audio-dsp:6000
    depends_on:
      - cache
      - api
    networks:
      - dieter-net

  # ----------------------------------------------------------
  # AUDIO DSP: Python FastAPI + PyTorch (Demucs, MusicGen)
  # ----------------------------------------------------------
  audio-dsp:
    build:
      context: ../../apps/audio-dsp
      dockerfile: Dockerfile
    container_name: dieter-audio-dsp
    restart: unless-stopped
    env_file: ../../.env
    environment:
      - PYTHONUNBUFFERED=1
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
    ports:
      - "6000:6000"
    volumes:
      - model_cache:/root/.cache/torch
    networks:
      - dieter-net
    # Uncomment below if you have a GPU on your VPS:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

# ----------------------------------------------------------
# NETWORKS
# ----------------------------------------------------------
networks:
  dieter-net:
    driver: bridge
    name: dieter-network

# ----------------------------------------------------------
# VOLUMES
# ----------------------------------------------------------
volumes:
  db_data:
    name: dieter-db-data
  redis_data:
    name: dieter-redis-data
  model_cache:
    name: dieter-model-cache
